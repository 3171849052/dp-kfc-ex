algorithm: dp_kfc
seed: 42
model:
  name: simple_cnn
data:
  dataset: mnist
  root: exp1/data
  batch_size: 256
  eval_batch_size: 256
  num_workers: 0
training:
  epochs: 5
  optimizer: adamw
  learning_rate: 0.001
  betas: [0.9, 0.999]
  eps: 1.0e-8
  weight_decay: 0.01
privacy:
  epsilon: 1.0
  delta: 1.0e-05
  max_grad_norm: 1.0
  accountant: rdp
synthetic:
  samples: 256
  batch_size: 256
  distribution: pink_noise
  refresh_every_epochs: 1
kfac:
  damping: 0.001
runtime:
  device: cuda
  gpu: 0
  threads: 4
  deterministic: true
output:
  root: outputs
