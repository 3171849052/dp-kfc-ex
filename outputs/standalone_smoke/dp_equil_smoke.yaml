algorithm: dp_equil
data:
  batch_size: 4
  dataset: mnist
  eval_batch_size: 4
  num_workers: 0
  root: exp1/data
equil:
  probes: 2
  scale_max: 10.0
  scale_min: 0.1
  tau: 0.01
kfac:
  damping: 0.001
model:
  name: simple_cnn
output:
  root: /media/data/data/lt/DP-KFC/outputs/standalone_smoke
privacy:
  accountant: rdp
  delta: 1.0e-05
  epsilon: 1.0
  max_grad_norm: 1.0
runtime:
  deterministic: true
  device: cpu
  gpu: 0
  threads: 1
seed: 42
synthetic:
  batch_size: 4
  distribution: pink_noise
  refresh_every_epochs: 1
  samples: 8
training:
  epochs: 1
  learning_rate: 0.1
  momentum: 0.9
  optimizer: sgd
  weight_decay: 0.0
